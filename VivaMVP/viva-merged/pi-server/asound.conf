# /etc/asound.conf — Pi I2S 오디오(INMP441 마이크 + MAX98357 앰프) 구성.
# app.py 의 RECORD_DEVICE(micboost) / PLAY_DEVICE(dmixout) 가 이 정의를 쓴다.

# 녹음: INMP441 원신호가 낮아(발화 peak ~2%FS) 소프트볼륨 부스트 필수.
# 게인은 amixer -c 0 sset MicBoost 90% 로 설정 후 sudo alsactl store 로 영속화.
# 100%(+28dB)는 근거리 큰 목소리에서 클리핑 — 90%(+20dB)가 실측 적정.
pcm.micboost {
    type softvol
    slave.pcm "plughw:0"
    control.name "MicBoost"
    control.card 0
    max_dB 30.0
}

# 재생: plug(포맷 변환) → softvol(볼륨) → dmix(믹싱) 체인.
# - Speaker softvol (2026-08-20): 스피커를 8Ω→4Ω 3W 로 바꾸자 같은 풀스케일
#   신호에서 출력이 2배(MAX98357A 5V/4Ω ≈ 3.2W, 10%THD 영역)가 돼 소리가
#   깨졌다. 재생 체인에 볼륨 스테이지가 없어 mpg123 가 항상 풀스케일로
#   때리던 게 근본 원인 - 디지털 감쇠 노브를 여기 둔다. 설정은 MicBoost 와
#   동일 패턴: amixer -c 0 sset Speaker 85% 후 sudo alsactl store.
#   85%(약 -7dB)가 4Ω 시작점 - 깨지면 내리고, 작으면 90%까지 올려본다.
# - dmix: viva-silence.service 의 상시 무음 스트림과 공유해 I2S 클럭을 안
#   끊는다 (끊기면 MAX98357 이 재생 시작/끝마다 "툭" 팝 노이즈).
pcm.dmixout {
    type plug
    slave.pcm "spkvol"
}
pcm.spkvol {
    type softvol
    slave.pcm "dmixraw"
    control.name "Speaker"
    control.card 0
    max_dB 0.0
}
pcm.dmixraw {
    type dmix
    ipc_key 1024
    slave { pcm "hw:0,0" rate 48000 format S32_LE channels 2 }
}
